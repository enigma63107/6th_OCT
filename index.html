<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Live Gujarati">
  <meta name="theme-color" content="#0f766e">
  <title>Live Gujarati</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Live Gujarati</h1>
      <button id="setupBtn" class="link setup-btn">Setup</button>
    </div>
    <div class="langs">
      <label>They speak
        <select id="sourceLang">
          <option value="auto">Mixed: English, Hindi, Gujarati</option>
          <option value="en-US">English (US)</option>
          <option value="en-IN">English (India)</option>
          <option value="en-GB">English (UK)</option>
          <option value="hi-IN">Hindi</option>
          <option value="mr-IN">Marathi</option>
          <option value="gu-IN">Gujarati</option>
        </select>
      </label>
      <span class="arrow">→</span>
      <label>Show me
        <select id="targetLang">
          <option value="gu">Gujarati</option>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <section id="setup" class="card setup" hidden>
      <h2>Mixed-language listening</h2>
      <p>To understand English, Hindi and Gujarati mixed together, the app uses Groq's free speech AI.
        Get a free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>
        and paste it here. It's stored only on this phone.</p>
      <form id="keyForm" class="type-form">
        <input id="keyInput" type="password" placeholder="gsk_…" autocomplete="off" aria-label="Groq API key">
        <button type="submit">Save</button>
      </form>
      <p id="keyState" class="small"></p>
    </section>

    <section id="live" class="card live" aria-live="polite">
      <p class="hint" id="hint">Tap the mic and hold your phone towards the person speaking.</p>
      <p class="original" id="liveOriginal"></p>
      <p class="translated" id="liveTranslated" lang="gu"></p>
      <p class="translit" id="liveTranslit"></p>
      <p class="meaning" id="liveMeaning"></p>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="history">Conversation</button>
      <button class="tab" data-tab="saved">Saved phrases</button>
    </nav>
    <ol id="history" class="list"></ol>
    <ol id="saved" class="list" hidden></ol>
  </main>

  <footer>
    <form id="typeForm" class="type-form">
      <input id="typeInput" type="text" placeholder="Or type something to translate…" autocomplete="off">
      <button type="submit">Go</button>
    </form>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="speakToggle"> Speak aloud</label>
      <button id="micBtn" class="mic" aria-label="Start listening">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <button id="clearBtn" class="link">Clear</button>
    </div>
    <p id="status" class="status"></p>
  </footer>

  <script src="translit.js"></script>
  <script src="listen-groq.js"></script>
  <script src="app.js"></script>
</body>
</html>
